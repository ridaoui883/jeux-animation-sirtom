<style>
:root{
  /* Charte SIRTOM : vert du logo, noir encre, blanc */
  --brand:#63AC74; --brand-d:#3E8752; --brand-l:#E4F1E7; --brand-ll:#F2F8F3;
  --kraft:var(--brand-ll); --kraft-2:var(--brand-l); --kraft-d:#A9D1B2; --ink:#221E1D; --ink-2:#4F4845;
  --jaune:#F2C200; --verre:#2E7D4F; --compost:#7A4B24; --om:#4E545C; --dech:#2B5DA8;
  --ok:#2E7D4F; --ko:#B3261E; --paper:#FFFFFF;
  --display:"Archivo Black","Arial Black",Impact,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--kraft);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;
  background-image:radial-gradient(circle at 100% 0,rgba(99,172,116,.18),transparent 45%),radial-gradient(circle at 0 100%,rgba(99,172,116,.14),transparent 40%);background-attachment:fixed}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brandmark{height:64px;width:auto;display:block}
.logo{font-family:var(--display);font-size:clamp(26px,4vw,40px);letter-spacing:-.5px;line-height:1;text-transform:uppercase}
.logo span{background:var(--brand);color:var(--ink);padding:0 .18em;display:inline-block;transform:rotate(-2deg);border-radius:4px}
.sub{font-size:14px;color:var(--ink-2);flex:1;min-width:200px}
nav{display:flex;flex-wrap:wrap;gap:6px}
nav button{font:700 14px var(--body);border:2px solid var(--ink);background:var(--paper);color:var(--ink);padding:7px 12px;border-radius:999px;cursor:pointer}
nav button[aria-current="true"]{background:var(--brand);color:var(--ink)}
button:focus-visible{outline:3px solid var(--dech);outline-offset:2px}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.team{display:flex;align-items:center;gap:10px;background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:8px 12px}
.team input{font-size:18px!important}
.team.active{box-shadow:5px 5px 0 var(--brand-d);transform:translate(-2px,-2px)}
.team .dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid var(--ink)}
.team input{flex:1;min-width:0;border:none;background:transparent;font:700 15px var(--body);color:var(--ink)}
.team .pts{font-family:var(--display);font-size:34px;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.team .adj{display:flex;flex-direction:column;gap:2px}
.team .adj button{border:1px solid var(--ink);background:var(--kraft-2);width:22px;height:18px;line-height:14px;padding:0;font-weight:700;cursor:pointer;border-radius:4px;color:var(--ink)}
.stage{background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:clamp(18px,3.5vw,40px);box-shadow:8px 8px 0 var(--brand);display:flex;flex-direction:column;gap:18px;min-height:420px}
.eyebrow{font:700 13px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--brand-d);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow .turn{background:var(--ink);color:var(--paper);padding:3px 10px;border-radius:999px;letter-spacing:.05em}
h1,h2{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:clamp(34px,6vw,72px)}
h2{font-size:clamp(26px,4vw,46px)}
.hl{color:var(--brand-d)}
.hero{display:flex;gap:20px 32px;align-items:center;flex-wrap:wrap}
.hero > div{flex:1;min-width:260px;display:flex;flex-direction:column;gap:14px}
.hero img{width:min(260px,60vw);height:auto}
.big-item{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.big-item .emo{flex:none;line-height:0}
.big-item .emo svg{width:clamp(110px,15vw,170px);height:auto;display:block;filter:drop-shadow(4px 4px 0 rgba(34,30,29,.12))}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bin{border:3px solid var(--ink);border-radius:12px 12px 16px 16px;padding:16px 10px 12px;color:#fff;font:700 17px var(--body);cursor:pointer;text-align:center;position:relative;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.bin::before{content:"";position:absolute;left:-3px;right:-3px;top:-3px;height:16px;background:rgba(0,0,0,.25);border-radius:10px 10px 0 0;border:3px solid var(--ink)}
.bin small{font-weight:400;font-size:13px;opacity:.9}
.bin.jaune{background:var(--jaune);color:var(--ink)} .bin.verre{background:var(--verre)} .bin.compost{background:var(--compost)} .bin.om{background:var(--om)} .bin.dech{background:var(--dech)}
.bin[disabled]{cursor:default;opacity:.35}
.bin.right{opacity:1;outline:5px solid var(--ok);outline-offset:3px}
.bin.wrong{opacity:1;outline:5px dashed var(--ko);outline-offset:3px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.choice{border:3px solid var(--ink);background:var(--kraft-2);border-radius:12px;padding:16px;font:700 20px var(--body);cursor:pointer;color:var(--ink);text-align:left}
.choice.vrai{background:#CFE8D6}.choice.faux{background:#F3D2CC}
.choice[disabled]{cursor:default;opacity:.45}
.choice.right{opacity:1;outline:5px solid var(--ok);outline-offset:3px}
.choice.wrong{opacity:1;outline:5px dashed var(--ko);outline-offset:3px}
.verdict{border-left:8px solid var(--ok);background:#EAF4EC;padding:14px 16px;border-radius:0 10px 10px 0;font-size:18px}
.verdict.ko{border-color:var(--ko);background:#F9E6E3}
.verdict b{font-family:var(--display);font-weight:400;font-size:22px;display:block;margin-bottom:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:700 16px var(--body);border:3px solid var(--ink);background:var(--brand);color:var(--ink);padding:10px 18px;border-radius:10px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.btn.ghost{background:var(--paper)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.progress{height:10px;background:var(--kraft-2);border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--brand);transition:width .3s}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.mcard{border:2px solid var(--ink);border-top:8px solid var(--brand);border-radius:12px;padding:16px;background:var(--brand-ll);display:flex;flex-direction:column;gap:6px}
.mcard h3{margin:0;font-family:var(--display);font-weight:400;font-size:21px}
.mcard .tag{font:700 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--brand-d)}
.mcard p{margin:0}
.lead{font-size:clamp(18px,2vw,22px);max-width:62ch;margin:0}
.station{border:2px solid var(--ink);border-radius:14px;overflow:hidden}
.station > header{padding:12px 16px;color:#fff;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.station > header h3{margin:0;font-family:var(--display);font-weight:400;font-size:24px}
.defi{display:grid;grid-template-columns:1fr auto;gap:10px 14px;padding:12px 16px;border-top:2px dashed var(--kraft-d);align-items:center;background:var(--paper)}
.defi p{margin:0}.defi .how{font-size:14px;color:var(--ink-2)}
.award{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.award button{border:2px solid var(--ink);border-radius:8px;padding:4px 8px;font:700 13px var(--body);cursor:pointer;background:var(--paper);color:var(--ink);display:flex;gap:5px;align-items:center}
.award button .dot{width:10px;height:10px;border-radius:50%}
@media (max-width:600px){.defi{grid-template-columns:1fr}.award{justify-content:flex-start}.brandmark{height:48px}}
.podium{display:flex;gap:10px;align-items:flex-end;justify-content:center;flex-wrap:wrap;min-height:220px}
.podium div{width:min(200px,38vw);border:3px solid var(--ink);border-radius:10px 10px 0 0;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;padding:10px 6px;color:#fff;font-weight:700;text-align:center}
.podium div span{font-family:var(--display);font-size:30px}
.endlogo{display:flex;justify-content:center}.endlogo img{width:160px;height:auto}
footer{font-size:13px;color:var(--ink-2);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
footer img{height:34px;width:auto}
.hint{font-size:14px;color:var(--ink-2)}
@media (prefers-reduced-motion:no-preference){
  .pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{from{transform:scale(.85);opacity:.3}to{transform:none;opacity:1}}
}

.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font:700 14px var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--brand-d)}
.field input,.field select{font:400 18px var(--body);color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:10px 12px;background:var(--brand-ll);width:100%}
.field input:focus{outline:3px solid var(--dech);outline-offset:1px}
.field.wide{grid-column:1/-1}
.tagline{display:flex;flex-wrap:wrap;gap:6px}
.tagline span{background:var(--brand-l);border:2px solid var(--ink);border-radius:999px;padding:3px 12px;font:700 14px var(--body)}
.err{color:var(--ko);font-weight:700}
@media print{nav,.adj,.row,footer,.hint{display:none!important}body{background:#fff}.stage{box-shadow:none}}
</style>

function renderNav(){$("#nav").innerHTML=VIEWS.filter(([k])=>k!=="terrain"||SESSION.terrain).map(([k,l])=>`<button data-v="${k}" aria-current="${state.view===k}">${l}</button>`).join("");

 <h2 class="pop">« ${q} »</h2>
 <div class="choices"><button class="choice vrai ${cls(true)}" ${a!==null?"disabled":""} onclick="answerVF(true)">VRAI</button><button class="choice faux ${cls(false)}" ${a!==null?"disabled":""} onclick="answerVF(false)">FAUX</button></div>
 ${a!==null?`<div class="verdict ${a===ans?"":"ko"}"><b>${a===ans?"Exact ! +1":"Eh non, c'est "+(ans?"VRAI":"FAUX")}</b>${expl}</div><div class="row"><button class="btn" onclick="next('vf')">Affirmation suivante →</button></div>`:""}`}
function answerVF(v){state.answered=v;if(v===state.order.vf[state.idx.vf][1])TEAMS[state.turn].pts+=1;save();render()}
function vQCM(){const n=QCM.length,i=state.idx.qcm;if(i>=n)return endRound("Moins de déchets",SESSION.terrain?"terrain":"podium");
 const [q,opts,ans,expl]=QCM[i],a=state.answered;
 return `<div class="eyebrow">Manche 3 · Moins de déchets · ${i+1}/${n} · 2 points ${teamLabel()}</div>${progress("qcm",n)}
 <h2 class="pop">${q}</h2>
 <div class="choices">${opts.map((o,j)=>`<button class="choice ${a===null?"":(j===ans?"right":(j===a?"wrong":""))}" ${a!==null?"disabled":""} onclick="answerQCM(${j})">${"ABCD"[j]}. ${o}</button>`).join("")}</div>
 ${a!==null?`<div class="verdict ${a===ans?"":"ko"}"><b>${a===ans?"Bravo ! +2":"Non — réponse "+"ABCD"[ans]}</b>${expl}</div><div class="row"><button class="btn" onclick="next('qcm')">Question suivante →</button></div>`:""}`}
function answerQCM(j){state.answered=j;if(j===QCM[state.idx.qcm][2])TEAMS[state.turn].pts+=2;save();render()}
function endRound(name,nx){const lbl=VIEWS.find(v=>v[0]===nx)[1];return `<div class="eyebrow">Fin de manche</div><h2>« ${name} » terminé !</h2><p class="lead">Regardez le tableau des scores… la suite peut tout changer.</p><div class="row"><button class="btn" onclick="state.view='${nx}';render()">${lbl} →</button></div>`}
function vTerrain(){return `<div class="eyebrow">Parcours terrain · pour l'animateur, sur tablette ou téléphone</div>
 <h2>9 défis sur les installations</h2>
 <p class="lead">Lancez chaque défi sur place, puis attribuez le point à l'équipe gagnante d'un simple tap.</p>
 ${STATIONS.map(s=>`<article class="station"><header style="background:${s.color}"><h3>${s.name}</h3><span>${s.tag}</span></header>
  ${s.defis.map(([t,h])=>`<div class="defi"><div><p><b>${t}</b></p><p class="how">${h}</p></div><div class="award">${TEAMS.map((tm,i)=>`<button onclick="addPts(${i},1);this.animate&&this.animate([{transform:'scale(1.2)'},{transform:'none'}],200)"><span class="dot" style="background:${tm.color}"></span>+1 ${esc(tm.name)}</button>`).join("")}</div></div>`).join("")}
 </article>`).join("")}
 <div class="row"><button class="btn" onclick="state.view='podium';render()">Voir le podium →</button></div>`}
function vPodium(){const r=TEAMS.map((t,i)=>({...t,i})).sort((a,b)=>b.pts-a.pts);const h=[170,130,100,80];
 const order=[r[1],r[0]].filter(Boolean);const tie=r[1]&&r[0].pts===r[1].pts;
 return `<div class="eyebrow">Résultats${SESSION.public?" · "+sessionLine():""}</div><h1>${tie?"Égalité parfaite !":`Bravo <span class="hl">${esc(r[0].name)}</span> !`}</h1>
 <div class="podium">${order.map(t=>{const rank=r.indexOf(t);return `<div style="height:${h[rank]+40}px;background:${t.color};color:${t.color==="#F2C200"?"#221E1D":"#fff"}"><span>${rank+1}</span>${esc(t.name)}<br>${t.pts} pts</div>`}).join("")}</div>
 <p class="lead">À retenir pour votre défi : d'abord refuser et réduire, ensuite réutiliser, puis trier. Les biodéchets retournent au sol grâce au compost. Chaque foyer choisit maintenant un geste à tester dès cette semaine.</p>
 <div class="endlogo"><img src="${LOGO}" alt="SIRTOM de la région Flers-Condé — merci !"></div>
 <div class="row"><button class="btn" onclick="window.print()">Imprimer / PDF du résultat</button><button class="btn ghost" onclick="resetAll()">Nouvelle partie</button></div>`}
function resetAll(){TEAMS.forEach(t=>t.pts=0);state.idx={tri:0,vf:0,qcm:0};state.turn=0;state.answered=null;state.order.tri=shuffle(ITEMS);state.order.vf=shuffle(VF);state.view="partie";SESSION.date=TODAY;saveSession();save();render()}
function render(){renderNav();renderScores();$("#sub").innerHTML="Animation SIRTOM de la région Flers-Condé"+(SESSION.public?" · "+sessionLine():"");$("#stage").innerHTML=({partie:vPartie,accueil:vAccueil,sirtom:vSirtom,tri:vTri,vf:vVF,qcm:vQCM,terrain:vTerrain,podium:vPodium})[state.view]()}
render();
</script>
</body></html>
